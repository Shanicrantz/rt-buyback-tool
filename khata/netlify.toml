# RT Khata — its own Netlify site, separate from rt-buyback-tool.
# The weekly buyback refresh publishes only the seven buyback runtime files;
# keeping the khata on its own site means those deploys can never remove it.
[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
